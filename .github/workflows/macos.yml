name: macOS build

# Every push to main builds the app and publishes it as release v<VERSION>.
# To ship a new version, change the VERSION file and push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Test
        run: swift test

      - name: Build universal app
        run: UNIVERSAL=1 ./scripts/build-app.sh

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: RtlTerminal-macOS
          path: |
            dist/*.zip
            dist/*.dmg

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v$VERSION"
          # Fixed asset names keep .../releases/latest/download/<name> working.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/RtlTerminal-macOS.dmg dist/RtlTerminal-macOS.zip --clobber
          else
            gh release create "$TAG" dist/RtlTerminal-macOS.dmg dist/RtlTerminal-macOS.zip \
              --title "Rtl Terminal for macOS $VERSION" \
              --target "$GITHUB_SHA" \
              --generate-notes
          fi
